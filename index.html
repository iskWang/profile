    <!-- Non-critical GA: load on first intent or five seconds after page load. -->
    <script>
      (() => {
        const measurementId = 'G-6XYV1VQQDX';
        const events = ['scroll', 'pointerdown', 'keydown'];
        let loaded = false;

        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function gtag() { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', measurementId);

        const loadAnalytics = () => {
          if (loaded) return;
          loaded = true;
          events.forEach((event) => window.removeEventListener(event, loadAnalytics));

          const script = document.createElement('script');
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${measurementId}`;
          document.head.appendChild(script);
        };

        events.forEach((event) => window.addEventListener(event, loadAnalytics, { once: true, passive: true }));
        window.addEventListener(
          'load',
          () => window.setTimeout(loadAnalytics, 5000),
          { once: true },
        );
      })();
    </script>
