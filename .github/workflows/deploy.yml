name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compute version message
        id: version_message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || format('Manual deploy of {0}', github.sha) }}
        run: |
          MSG="${COMMIT_MSG%%$'\n'*}"
          MSG="${MSG//[\"\\\$\`]/}"
          MSG="${MSG:0:100}"
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ steps.version_message.outputs.message }}"
