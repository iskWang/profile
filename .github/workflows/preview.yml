name: Blog Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --message "PR #${{ github.event.pull_request.number }}"
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const output = process.env.PREVIEW_OUTPUT || '';
            const match = output.match(/Version Preview URL:\s*(\S+)/);
            const url = match ? match[1] : null;
            const body = url
              ? `Preview: ${url}\n\nThis workflow uploads a preview version without changing production traffic. Merging this PR into main triggers production deployment through deploy.yml.`
              : `Preview upload ran but no preview URL was found in the wrangler output. Check the workflow log.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
